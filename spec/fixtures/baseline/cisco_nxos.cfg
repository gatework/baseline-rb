hostname LAB-NXOS
feature ssh
feature tacacs+
no feature telnet
no feature ftp-server
no feature tftp-server
aaa authentication login default group OPS
aaa authorization commands default group OPS local
aaa authorization config-commands default group OPS local
aaa accounting default group OPS
tacacs-server host 192.0.2.30 key 7 PRIVATE-NXOS-TACACS1
tacacs-server host 192.0.2.31 key 6 PRIVATE-NXOS-TACACS2
username operator password 5 PRIVATE-NXOS-HASH role network-admin
ntp server 192.0.2.10 use-vrf management
ntp server 192.0.2.11 use-vrf management
logging server 192.0.2.20 use-vrf management
snmp-server community PRIVATE-NXOS-COMMUNITY group network-operator
snmp-server community PRIVATE-NXOS-COMMUNITY use-ipv4acl MGMT
snmp-server user observer network-operator auth sha PRIVATE-NXOS-AUTH priv aes-128 PRIVATE-NXOS-PRIV use-ipv4acl MGMT
!
ip access-list MGMT
 10 permit ip 198.51.100.0/24 any
 20 deny ip any any
!
aaa group server tacacs+ OPS
 server 192.0.2.30
 server 192.0.2.31
!
line vty
 access-class MGMT in
!
end
