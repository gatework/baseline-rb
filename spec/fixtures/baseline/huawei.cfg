sysname LAB-VRP
stelnet server enable
ssh server compatible-ssh1x disable
ssh server acl 2000
undo telnet server enable
undo ip http enable
undo ftp server enable
undo tftp server enable
ntp-service unicast-server 192.0.2.10
ntp-service unicast-server 192.0.2.11
info-center loghost 192.0.2.20
snmp-agent
snmp-agent sys-info version v3
snmp-agent usm-user v3 observer authentication-mode sha cipher PRIVATE-VRP-AUTH
snmp-agent usm-user v3 observer privacy-mode aes128 cipher PRIVATE-VRP-PRIV
snmp-agent usm-user v3 observer acl 2000
domain OPS admin
#
acl number 2000
 rule 5 permit source 198.51.100.0 0.0.0.255
 rule 10 deny
#
hwtacacs-server template OPS
 hwtacacs-server authentication 192.0.2.30
 hwtacacs-server authorization 192.0.2.30
 hwtacacs-server accounting 192.0.2.31
 hwtacacs-server shared-key cipher PRIVATE-VRP-TACACS
#
aaa
 authentication-scheme TAC
  authentication-mode hwtacacs local
 authorization-scheme TAC
  authorization-mode hwtacacs local
 accounting-scheme TAC
  accounting-mode hwtacacs
 domain OPS
  authentication-scheme TAC
  authorization-scheme TAC
  accounting-scheme TAC
  hwtacacs-server OPS
 local-user operator password irreversible-cipher PRIVATE-VRP-HASH
 local-user operator service-type ssh
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 acl 2000 inbound
#
return
