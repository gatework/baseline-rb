sysname LAB-H3C
ssh server enable
ssh server compatible-ssh1x disable
ssh server acl 2000
undo telnet server enable
undo ip http enable
undo ftp server enable
undo tftp server enable
ntp-service unicast-server 192.0.2.10
ntp-service unicast-server 192.0.2.11
ntp-service authentication enable
info-center loghost 192.0.2.20
info-center loghost 192.0.2.21
info-center loghost source LoopBack0
snmp-agent
snmp-agent sys-info version v3
snmp-agent community read simple PRIVATE-H3C-COMMUNITY acl 2000
snmp-agent usm-user v3 observer readgroup authentication-mode sha cipher PRIVATE-SNMP-AUTH privacy-mode aes128 cipher PRIVATE-SNMP-PRIV acl 2000
#
acl basic 2000
 rule 5 deny source 198.51.100.128 0.0.0.127
 rule 10 permit source 198.51.100.0 0.0.0.255
 rule 15 deny
#
hwtacacs scheme OPS
 primary authentication 192.0.2.30
 primary authorization 192.0.2.30
 primary accounting 192.0.2.30
 secondary authentication 192.0.2.31
 key authentication cipher PRIVATE-TACACS-AUTH
 key authorization cipher PRIVATE-TACACS-AUTHOR
 key accounting cipher PRIVATE-TACACS-ACCOUNT
#
domain OPS
 authentication login hwtacacs-scheme OPS local
 authorization login hwtacacs-scheme OPS local
 accounting login hwtacacs-scheme OPS
#
domain default enable OPS
local-user operator class manage
 password simple admin
 service-type ssh
#
line vty 0 63
 authentication-mode scheme
 protocol inbound ssh
 acl 2000 inbound
#
interface GigabitEthernet1/0/1
 description Lab access port
 ntp-service unicast-server 203.0.113.99
#
return
