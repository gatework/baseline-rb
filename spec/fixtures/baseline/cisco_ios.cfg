hostname LAB-IOS
aaa new-model
aaa authentication login default group OPS local
aaa authorization exec default group OPS local
aaa accounting exec default start-stop group OPS
ip ssh version 2
no ip http server
no ftp-server enable
no tftp-server flash:test
ntp server 192.0.2.10
ntp server 192.0.2.11
ntp authenticate
logging host 192.0.2.20
logging source-interface Loopback0
snmp-server community PRIVATE-IOS-COMMUNITY RO MGMT
snmp-server user observer READONLY v3 auth sha PRIVATE-IOS-AUTH priv aes 128 PRIVATE-IOS-PRIV access MGMT
username operator privilege 15 secret 9 PRIVATE-IOS-HASH
enable secret 8 PRIVATE-IOS-ENABLE
!
ip access-list standard MGMT
 5 deny 198.51.100.128 0.0.0.127
 10 permit 198.51.100.0 0.0.0.255
 15 deny any
!
tacacs server AAA1
 address ipv4 192.0.2.30
 key 6 PRIVATE-IOS-TACACS1
!
tacacs server AAA2
 address ipv4 192.0.2.31
 key 6 PRIVATE-IOS-TACACS2
!
aaa group server tacacs+ OPS
 server name AAA1
 server name AAA2
!
line vty 0 15
 login authentication default
 transport input ssh
 access-class MGMT in
!
end
